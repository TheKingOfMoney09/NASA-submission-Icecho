<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Last Note — 47 years of Arctic sea ice, played as music</title>
<meta name="description" content="An offline, audio-first sonification of the Arctic sea ice record, 1979–2026. NASA Space Apps Challenge 2026.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1 class="sr-only">The Last Note</h1>

<button id="begin-gate" type="button" aria-label="Play the last note">
  <span class="cover">
    <span class="cover-glow" aria-hidden="true"></span>

    <span class="cover-corner cover-corner-tl" aria-hidden="true">47 Septembers</span>
    <span class="cover-corner cover-corner-tr" aria-hidden="true">1979&#8211;2026</span>
    <span class="cover-corner cover-corner-bl" aria-hidden="true">Scroll</span>
    <span class="cover-corner cover-corner-br" aria-hidden="true">NASA Space Apps 2026</span>

    <span class="cover-mid" aria-hidden="true">
      <span class="cover-title" id="cover-title">The Last Note</span>
      <span class="cover-sub">Every song ends somewhere. Listen to where this one goes.</span>
      <span class="cover-cta"><span class="cover-cta-label">Play the last note</span></span>
    </span>

    <svg class="cover-wave" viewBox="0 0 1200 80" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="cover-fade" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#7fd4f2" stop-opacity="0"></stop>
          <stop offset="0.5" stop-color="#7fd4f2" stop-opacity="1"></stop>
          <stop offset="1" stop-color="#7fd4f2" stop-opacity="0"></stop>
        </linearGradient>
      </defs>
      <line class="cover-median" x1="0" y1="40" x2="1200" y2="40"></line>
      <path class="cover-trace" vector-effect="non-scaling-stroke"
            d="M0,40 C50,40 70,24 120,27 S190,52 240,47 S310,22 360,28 S430,54 480,49 S550,24 600,30 S670,52 720,46 S790,26 840,31 S910,50 960,44 S1030,28 1080,34 S1150,50 1200,40"></path>
    </svg>
  </span>
</button>

<a class="skip" href="#act-1">Skip to the story</a>

<header>
  <p id="year" aria-hidden="true">1979</p>
  <p id="readout"></p>
</header>

<div id="stage">
  <canvas id="canvas" role="img" aria-label="Arctic sea ice rendered as it is sonified. Every act carries a written transcript."></canvas>
</div>

<main>
  <section id="act-0" aria-labelledby="act-0-title"></section>
  <section id="act-1" aria-labelledby="act-1-title"></section>
  <section id="act-2" aria-labelledby="act-2-title">
    <div id="mapping"></div>
  </section>
  <section id="act-3" aria-labelledby="act-3-title"></section>
  <section id="act-4" aria-labelledby="act-4-title"></section>
  <section id="act-5" aria-labelledby="act-5-title"></section>
</main>

<div id="transport">
  <button id="playpause" type="button" aria-pressed="false">Play</button>
  <input id="scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="Timeline: 1979 to 2026">
</div>

<footer>
  <p id="credits">Maps: NSIDC Sea Ice Index v4 (G02135), National Snow and Ice Data Center, University of Colorado Boulder (Fetterer et al.). Visual reference: NASA Scientific Visualization Studio, SVS 5677 (Trent L. Schindler).</p>
</footer>

<div id="live-region" role="status" aria-live="polite"></div>

<script id="frames-data" type="application/json"></script>

<script defer src="js/core.js"></script>
<script defer src="js/loader.js"></script>
<script defer src="js/content.js"></script>
<script defer src="js/audio.js"></script>
<script defer src="js/engine.js"></script>
<script defer src="js/render.js"></script>
<script defer src="js/scroll.js"></script>
<script defer src="js/main.js"></script>
</body>
</html>
